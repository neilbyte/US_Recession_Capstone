
name: Weekly Macro Data Ingest & S3 Sync

on:
  schedule:
    # RUNS EVERY SUNDAY AT 00:00 UTC (Cron format)
    - cron: '0 0 * * 0'
  workflow_dispatch:
    # ALLOWS USER TO MANUAL TRIGGER IT WITH A BUTTON ON GITHUB FOR TESTING

jobs:
  ingest-and-sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Ingest Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Ingestion Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install boto3 pandas pandas_datareader

    - name: Configure AWS Credentials Securely
      uses: aws-actions/configure-aws-credentials@v4
      with:
        # UTILIZES ENCRYPTED ENVIRONMENT SECRETS
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-west-2

    - name: Execute Harvesting ETL Script
      run: |
        python data/data_pipeline/harvest_and_sync.ipynb